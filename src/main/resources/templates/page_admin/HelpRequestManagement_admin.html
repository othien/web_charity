<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý yêu cầu hỗ trợ</title>
    <link rel="stylesheet" href="/assets/css/main/app.css">
    <link rel="stylesheet" href="/assets/css/main/app-dark.css">
    <link rel="stylesheet" href="/assets/extensions/simple-datatables/style.css">
    <link rel="stylesheet" href="/assets/css/pages/simple-datatables.css">
    <link rel="stylesheet" href="/assets/extensions/@fortawesome/fontawesome-free/css/all.min.css">
</head>

<body>
    <div id="app">
        <div id="sidebar" class="active">
            <div class="sidebar-wrapper active">
                <div class="sidebar-header position-relative">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="logo">
                            <a href="index.html"><img src="/assets/images/logo/logo.svg" alt="Logo" srcset=""></a>
                        </div>
                        <div class="theme-toggle d-flex gap-2  align-items-center mt-2">
                            <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
                                aria-hidden="true" role="img" class="iconify iconify--system-uicons" width="20"
                                height="20" preserveAspectRatio="xMidYMid meet" viewBox="0 0 21 21">
                                <g fill="none" fill-rule="evenodd" stroke="currentColor" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path
                                        d="M10.5 14.5c2.219 0 4-1.763 4-3.982a4.003 4.003 0 0 0-4-4.018c-2.219 0-4 1.781-4 4c0 2.219 1.781 4 4 4zM4.136 4.136L5.55 5.55m9.9 9.9l1.414 1.414M1.5 10.5h2m14 0h2M4.135 16.863L5.55 15.45m9.899-9.9l1.414-1.415M10.5 19.5v-2m0-14v-2"
                                        opacity=".3"></path>
                                    <g transform="translate(-210 -1)">
                                        <path d="M220.5 2.5v2m6.5.5l-1.5 1.5"></path>
                                        <circle cx="220.5" cy="11.5" r="4"></circle>
                                        <path d="m214 5l1.5 1.5m5 14v-2m6.5-.5l-1.5-1.5M214 18l1.5-1.5m-4-5h2m14 0h2">
                                        </path>
                                    </g>
                                </g>
                            </svg>
                            <div class="form-check form-switch fs-6">
                                <input class="form-check-input  me-0" type="checkbox" id="toggle-dark">
                                <label class="form-check-label"></label>
                            </div>
                            <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
                                aria-hidden="true" role="img" class="iconify iconify--mdi" width="20" height="20"
                                preserveAspectRatio="xMidYMid meet" viewBox="0 0 24 24">
                                <path fill="currentColor"
                                    d="m17.75 4.09l-2.53 1.94l.91 3.06l-2.63-1.81l-2.63 1.81l.91-3.06l-2.53-1.94L12.44 4l1.06-3l1.06 3l3.19.09m3.5 6.91l-1.64 1.25l.59 1.98l-1.7-1.17l-1.7 1.17l.59-1.98L15.75 11l2.06-.05L18.5 9l.69 1.95l2.06.05m-2.28 4.95c.83-.08 1.72 1.1 1.19 1.85c-.32.45-.66.87-1.08 1.27C15.17 23 8.84 23 4.94 19.07c-3.91-3.9-3.91-10.24 0-14.14c.4-.4.82-.76 1.27-1.08c.75-.53 1.93.36 1.85 1.19c-.27 2.86.69 5.83 2.89 8.02a9.96 9.96 0 0 0 8.02 2.89m-1.64 2.02a12.08 12.08 0 0 1-7.8-3.47c-2.17-2.19-3.33-5-3.49-7.82c-2.81 3.14-2.7 7.96.31 10.98c3.02 3.01 7.84 3.12 10.98.31Z">
                                </path>
                            </svg>
                        </div>
                        <div class="sidebar-toggler  x">
                            <a href="#" class="sidebar-hide d-xl-none d-block"><i class="bi bi-x bi-middle"></i></a>
                        </div>
                    </div>
                </div>

                <!-- Sidebar Menu -->
                <div th:replace="~{fragments/sidebar_admin :: sidebar}"></div>

            </div>
        </div>

        <div id="main">
            <header class="mb-3">
                <a href="#" class="burger-btn d-block d-xl-none">
                    <i class="bi bi-justify fs-3"></i>
                </a>
            </header>

            <div class="page-heading">
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6 order-md-1 order-last">
                            <h3>Quản Lý Yêu Cầu Hỗ Trợ</h3>
                            <p class="text-subtitle text-muted">Danh sách các hoàn cảnh cần giúp đỡ từ cộng đồng</p>
                        </div>
                        <div class="col-12 col-md-6 order-md-2 order-first">
                            <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a href="index.html">Dashboard</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">Quản Lý Yêu Cầu</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>

                <section class="section">
                    <div class="card">
                        <div class="card-header">
                            Bảng dữ liệu yêu cầu
                        </div>
                        <div class="card-body">
                            <table class="table table-striped" id="table1">
                                <thead>
                                    <tr>
                                        <th>Người Cần Giúp</th>
                                        <th>Người Báo Tin</th>
                                        <th>Mối Quan Hệ</th>
                                        <th>Trạng Thái</th> <!-- 0: Chờ, 1: Đã duyệt, 2: Từ chối -->
                                        <th>Hành Động</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="request : ${helpRequests}">
                                        <td>
                                            <span class="fw-bold" th:text="${request.beneficiaryName}"></span><br>
                                            <small th:text="${request.beneficiaryPhone}"></small>
                                        </td>
                                        <td>
                                            <span th:text="${request.reporterName}"></span><br>
                                            <small th:text="${request.reporterPhone}"></small>
                                        </td>
                                        <td th:text="${request.relationship}"></td>
                                        <td>
                                            <span class="badge bg-warning" th:if="${request.status == 0}">Chờ
                                                duyệt</span>
                                            <span class="badge bg-success" th:if="${request.status == 1}">Đã
                                                duyệt</span>
                                            <span class="badge bg-danger" th:if="${request.status == 2}">Từ chối</span>
                                        </td>
                                        <td>
                                            <!-- Actions -->
                                            <!-- View Detail Modal Trigger -->
                                            <button type="button" class="btn btn-sm btn-info" data-bs-toggle="modal"
                                                th:attr="data-bs-target='#detailModal'+${request.id}">
                                                <i class="fas fa-eye"></i>
                                            </button>

                                            <!-- Approve/Reject Forms -->
                                            <form th:action="@{'/dashboard_helprequest/updateStatus'}" method="post"
                                                style="display:inline;" th:if="${request.status == 0}">
                                                <input type="hidden" name="id" th:value="${request.id}">
                                                <input type="hidden" name="status" value="1">
                                                <button type="submit" class="btn btn-sm btn-success" title="Duyệt"><i
                                                        class="fas fa-check"></i></button>
                                            </form>
                                            <form th:action="@{'/dashboard_helprequest/updateStatus'}" method="post"
                                                style="display:inline;" th:if="${request.status == 0}">
                                                <input type="hidden" name="id" th:value="${request.id}">
                                                <input type="hidden" name="status" value="2">
                                                <button type="submit" class="btn btn-sm btn-danger" title="Từ chối"><i
                                                        class="fas fa-times"></i></button>
                                            </form>

                                            <!-- Detail Modal -->
                                            <div class="modal fade" th:id="'detailModal'+${request.id}" tabindex="-1"
                                                aria-hidden="true">
                                                <div class="modal-dialog modal-lg">
                                                    <div class="modal-content">
                                                        <div class="modal-header">
                                                            <h5 class="modal-title">Chi tiết yêu cầu</h5>
                                                            <button type="button" class="btn-close"
                                                                data-bs-dismiss="modal" aria-label="Close"></button>
                                                        </div>
                                                        <div class="modal-body">
                                                            <p><strong>Mô tả hoàn cảnh:</strong></p>
                                                            <p th:text="${request.description}"
                                                                style="white-space: pre-wrap;"></p>
                                                            <hr>
                                                            <p><strong>Email người báo tin:</strong> <span
                                                                    th:text="${request.reporterEmail}"></span></p>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <!-- Pagination (Reuse logic from other lists if needed, assuming small volume for now or add pagination later) -->
                        </div>
                    </div>
                </section>
            </div>

            <!-- Footer -->
            <div th:replace="~{fragments/footer_admin :: footer}"></div>
        </div>
    </div>

    <script src="/assets/js/bootstrap.js"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/assets/extensions/simple-datatables/umd/simple-datatables.js"></script>
    <script src="/assets/js/pages/simple-datatables.js"></script>
</body>

</html>
