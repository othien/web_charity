<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm bài viết chiến dịch</title>
    <!-- CDN bootstrap MDB -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <!-- MDB -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.2.0/mdb.min.css" rel="stylesheet" />
    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            padding: 20px;
        }

        form {
            width: 100%;
            max-width: 700px;
            /* Giới hạn chiều rộng của form */
            height: 100%;
            /* Đảm bảo form chiếm hết chiều cao của vùng cha */
            max-height: 85vh;
            /* Giới hạn chiều cao của form */
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            /* Khoảng cách giữa các phần tử */
            overflow-y: auto;
            /* Nếu form quá dài, sẽ có thanh cuộn dọc */
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #222831;
            margin-bottom: 15px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 1rem;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid #ced4da;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .form-control:focus {
            border-color: #00ADB5;
            box-shadow: 0 0 5px rgba(0, 173, 181, 0.5);
        }

        button[type="submit"] {
            background-color: #00ADB5;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: #393E46;
        }

        button[type="submit"]:focus {
            outline: none;
        }

        /* Media Query cho màn hình nhỏ */
        @media (max-width: 768px) {
            form {
                max-width: 100%;
                /* Form chiếm hết chiều rộng màn hình */
                padding: 15px;
                /* Giảm padding để vừa vặn hơn */
            }

            h1 {
                font-size: 1.6rem;
                /* Giảm kích thước font cho tiêu đề */
            }
        }
    </style>
</head>

<body>
    <form method="post" th:action="@{'/campaignmanagement/' + ${fundraisingCampaignModel.id}}">
        <h1>Phần tổng quát</h1>
        <div class="form-group">
            <label for="title">Tiêu đề chiến dịch</label>
            <input type="text" name="title" th:value="${fundraisingCampaignModel.title}" class="form-control" id="title"
                placeholder="Nhập tiêu đề chiến dịch" required />
        </div>
        <div class="form-group">
            <label for="imgUrl">Hình ảnh chiến dịch</label>
            <textarea name="imgUrl" th:text="${fundraisingCampaignModel.imgUrl}" rows="4" class="form-control"
                id="imgUrl" placeholder="Hình ảnh chiến dịch" required></textarea>
        </div>
        <div class="form-group">
            <label for="startDate">Ngày bắt đầu</label>
            <input type="date" name="startDate" th:value="${fundraisingCampaignModel.startDate}" class="form-control"
                id="startDate" required />
        </div>
        <div class="form-group">
            <label for="endDate">Ngày kết thúc</label>
            <input type="date" name="endDate" th:value="${fundraisingCampaignModel.endDate}" class="form-control"
                id="endDate" required />
        </div>
        <div class="form-group">
            <label for="goalAmount">Số tiền cần đạt</label>
            <input type="number" name="goalAmount" th:value="${fundraisingCampaignModel.goalAmount}"
                class="form-control" id="goalAmount" placeholder="Nhập số tiền cần đạt" required />
        </div>
        <div class="form-group">
            <label for="displaycategory">Loại chiến dịch</label>
            <select name="displaycategory" class="form-control" id="displaycategory" required>
                <option value="Y tế" th:selected="${fundraisingCampaignModel.displaycategory == 'Y tế'}">Y tế</option>
                <option value="Trẻ em" th:selected="${fundraisingCampaignModel.displaycategory == 'Trẻ em'}">Trẻ em
                </option>
                <option value="Giáo dục" th:selected="${fundraisingCampaignModel.displaycategory == 'Giáo dục'}">Giáo
                    dục</option>
                <option value="Bệnh hiểm nghèo"
                    th:selected="${fundraisingCampaignModel.displaycategory == 'Bệnh hiểm nghèo'}">Bệnh hiểm nghèo
                </option>
                <option value="Thiên tai" th:selected="${fundraisingCampaignModel.displaycategory == 'Thiên tai'}">Thiên
                    tai</option>
            </select>
        </div>
        <div class="form-group">
            <label for="code">Mã cú pháp</label>
            <input type="text" name="code" th:value="${fundraisingCampaignModel.code}" class="form-control" id="code"
                placeholder="Nhập mã cú pháp" required />
        </div>

        <!-- NEW CONTENT FIELDS for UPDATE -->
        <hr>
        <h3>Nội dung chi tiết</h3>

        <div class="form-group">
            <label for="content1">Nội dung đoạn 1</label>
            <textarea name="content1" class="form-control" id="content1" rows="4"
                th:text="${detail != null ? detail.content_1 : ''}"></textarea>
        </div>
        <div class="form-group">
            <label for="imgContent1">Ảnh minh họa 1</label>
            <input type="text" name="imgContent1" class="form-control" id="imgContent1"
                th:value="${detail != null ? detail.img_content : ''}" />
        </div>

        <div class="form-group">
            <label for="content2">Nội dung đoạn 2</label>
            <textarea name="content2" class="form-control" id="content2" rows="4"
                th:text="${detail != null ? detail.content_2 : ''}"></textarea>
        </div>
        <div class="form-group">
            <label for="imgContent2">Ảnh minh họa 2</label>
            <input type="text" name="imgContent2" class="form-control" id="imgContent2"
                th:value="${detail != null ? detail.img_content2 : ''}" />
        </div>

        <div class="form-group">
            <label for="content3">Nội dung đoạn 3 (Lời kết)</label>
            <textarea name="content3" class="form-control" id="content3" rows="4"
                th:text="${detail != null ? detail.content_3 : ''}"></textarea>
        </div>
        <div th:if="${error}" class="alert alert-danger">
            <p th:text="${error}"></p>
        </div>
        <button type="submit" class="btn btn-primary">Cập nhật</button>
    </form>

</body>
<!-- MDB -->
<!-- Include jQuery first -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

<!-- Then include MDB and other scripts -->
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.2.0/mdb.umd.min.js"></script>

</html>
