<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <title>Quản lý doanh thu</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- CDN bootstrap MDB -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <!-- MDB -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.2.0/mdb.min.css" rel="stylesheet" />
</head>

<style>
    body {
        font-family: 'Roboto', sans-serif;
        background-color: #f4f6f9;
        /* Light background for the dashboard */
        margin: 0;
        padding: 0;
    }

    h4 {
        margin-top: 20px;
        color: #343a40;
        font-weight: 500;
        text-align: center;
    }

    .table-container {
        margin: 20px auto;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        padding: 20px;
        width: 95%;
        overflow-x: hidden;
    }

    table {
        width: 100%;
        table-layout: fixed;
        margin-bottom: 0;
        border-collapse: collapse;
    }

    th,
    td {
        text-align: center;
        vertical-align: middle;
        padding: 12px;
        border: 1px solid #dee2e6;
        /* Light border for clearer separation */
    }

    thead th {
        color: #495057;
        font-weight: 600;
        font-size: 14px;
        background-color: #f8f9fa;
        /* Light background for header */
    }

    .pagination {
        margin-top: 20px;
        justify-content: center;
    }

    .pagination a {
        color: #007bff;
        text-decoration: none;
    }

    .pagination .page-item.active .page-link {
        background-color: #007bff;
        border-color: #007bff;
    }

    .btn-outline-primary,
    .btn-outline-danger,
    .btn-outline-success {
        width: 100%;
        font-size: 14px;
        margin: 5px 0;
    }

    .dropdown-toggle {
        width: 100%;
        text-align: center;
        font-size: 14px;
    }

    .dropdown-menu {
        min-width: 150px;
        padding: 10px;
    }

    .dropdown-toggle:focus {
        box-shadow: none;
    }

    /* Responsive design for smaller screens */
    @media (max-width: 768px) {
        .table-container {
            padding: 10px;
        }

        th,
        td {
            padding: 8px;
            font-size: 12px;
        }
    }

    /* Style for dropdown items */
    .dropdown-item {
        padding: 10px;
        text-align: center;
    }

    /* Hover effect for table rows */
    .table-hover tbody tr:hover {
        background-color: #f1f5f8;
    }

    /* Adjust column widths */
    th:nth-child(1),
    td:nth-child(1) {
        width: 5%;
    }

    th:nth-child(2),
    td:nth-child(2) {
        width: 15%;
    }

    th:nth-child(3),
    td:nth-child(3) {
        width: 15%;
    }

    th:nth-child(4),
    td:nth-child(4) {
        width: 15%;
    }

    th:nth-child(5),
    td:nth-child(5) {
        width: 15%;
    }

    th:nth-child(6),
    td:nth-child(6) {
        width: 25%;
    }

    /* Button hover effects */
    .btn-outline-primary {
        border-color: #17a2b8;
        color: #17a2b8;
    }

    .btn-outline-primary:hover {
        background-color: #17a2b8;
        color: #ffffff;
    }

    .btn-outline-danger {
        border-color: #dc3545;
        color: #dc3545;
    }

    .btn-outline-danger:hover {
        background-color: #dc3545;
        color: #ffffff;
    }

    .btn-primary.dropdown-toggle {
        background-color: #6c757d;
        border-color: #6c757d;
    }

    .btn-primary.dropdown-toggle:hover {
        background-color: #5a6268;
        border-color: #5a6268;
    }
</style>

<body>
    <h4 class="text-danger">Danh sách chương trình quyên góp</h4>

    <div class="container-fluid mb-4">
        <div class="card">
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <h5 class="card-title mb-0">Tổng doanh thu: <span class="text-success"
                                th:text="${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' VND'">0
                                VND</span>
                        </h5>
                    </div>
                    <div class="col-md-6 text-right">
                        <button type="button" class="btn btn-info btn-sm" onclick="printReport()">
                            <i class="fas fa-print"></i> In báo cáo
                        </button>
                        <button type="button" class="btn btn-success btn-sm" onclick="exportDetailedReport()">
                            <i class="fas fa-file-alt"></i> Xuất báo cáo chi tiết
                        </button>
                    </div>
                </div>
                <form th:action="@{/dashboard_revenuemanagement}" method="get" class="row align-items-end">
                    <div class="col-md-3">
                        <label>Tìm kiếm:</label>
                        <input type="text" name="searchTerm" th:value="${searchTerm}" placeholder="ID hoặc Nội dung"
                            class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label>Dự án:</label>
                        <select name="campaignId" class="form-control">
                            <option value="">-- Tất cả dự án --</option>
                            <option th:each="camp : ${campaigns}" th:value="${camp.id}" th:text="${camp.title}"
                                th:selected="${camp.id == selectedCampaignId}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label>Danh mục:</label>
                        <select name="category" class="form-control">
                            <option value="ALL">-- Tất cả --</option>
                            <option value="Y tế" th:selected="${selectedCategory == 'Y tế'}">Y tế</option>
                            <option value="Trẻ em" th:selected="${selectedCategory == 'Trẻ em'}">Trẻ em</option>
                            <option value="Giáo dục" th:selected="${selectedCategory == 'Giáo dục'}">Giáo dục</option>
                            <option value="Bệnh hiểm nghèo" th:selected="${selectedCategory == 'Bệnh hiểm nghèo'}">Bệnh
                                hiểm nghèo</option>
                            <option value="Thiên tai" th:selected="${selectedCategory == 'Thiên tai'}">Thiên tai
                            </option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <label>Quý:</label>
                        <select name="quarter" class="form-control">
                            <option value="">--</option>
                            <option value="1" th:selected="${selectedQuarter == 1}">Q1</option>
                            <option value="2" th:selected="${selectedQuarter == 2}">Q2</option>
                            <option value="3" th:selected="${selectedQuarter == 3}">Q3</option>
                            <option value="4" th:selected="${selectedQuarter == 4}">Q4</option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <label>Tháng:</label>
                        <select name="month" class="form-control">
                            <option value="">--</option>
                            <option th:each="m : ${#numbers.sequence(1, 12)}" th:value="${m}" th:text="${m}"
                                th:selected="${m == selectedMonth}"></option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <label>Năm:</label>
                        <select name="year" class="form-control">
                            <option value="">--</option>
                            <option th:each="y : ${#numbers.sequence(2023, 2030)}" th:value="${y}" th:text="${y}"
                                th:selected="${y == selectedYear}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Lọc & Tìm kiếm</button>
                        <a href="/dashboard_revenuemanagement" class="btn btn-secondary w-100 mt-1">Đặt lại</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="table-container">
        <table class="table align-middle" style="margin-top: 70px">
            <thead>
                <tr>
                    <th scope="col">Mã</th>
                    <th scope="col">Thời gian thanh toán</th>
                    <th scope="col">Số tiền</th>
                    <th scope="col">Nội dung chuyển khoản</th>
                    <th scope="col">Trạng thái</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="paymentModel : ${paymentModel}">
                    <th scope="row" th:text="${paymentModel.id}"></th>
                    <td th:text="${paymentModel.paymentTime}"></td>
                    <td th:text="${paymentModel.totalPrice}"></td>
                    <td th:text="${paymentModel.orderId}"></td>
                    <td th:text="${paymentModel.paymentStatus == 1 ? 'Thành công' : 'Thất bại'}"></td>
                    <td>
                        <div class="dropdown">
                            <button th:text="${paymentModel.display == 1 ? 'Hiển thị' : 'Đóng hiển thị'}"
                                class="btn btn-primary dropdown-toggle" type="button" id="dropdownMenuButton"
                                data-mdb-dropdown-init data-mdb-ripple-init aria-expanded="false"></button>
                            <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                                <li>
                                    <form th:action="@{/displayrevenue}" method="post">
                                        <input type="hidden" name="id" th:value="${paymentModel.id}" />
                                        <input type="hidden" name="display" value="1" />
                                        <button class="dropdown-item" type="submit">Hiển thị</button>
                                    </form>
                                </li>
                                <li>
                                    <form th:action="@{/displayrevenue}" method="post">
                                        <input type="hidden" name="id" th:value="${paymentModel.id}" />
                                        <input type="hidden" name="display" value="0" />
                                        <button class="dropdown-item" type="submit">Đóng hiển thị</button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </td>
                    <form th:action="@{/revenue/delete/{id_delete}(id_delete=${paymentModel.id})}" method="post"
                        id="deleteForm">
                        <td><button type="button" class="btn btn-outline-danger"
                                onclick="openDeleteModal(this.form.action)" data-mdb-ripple-init
                                data-mdb-ripple-color="dark">Xóa</button></td>
                    </form>
                </tr>
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            </tbody>


        </table>
    </div>

    <div class="pagination">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:if="${currentPage > 0}">
                <a class="page-link" th:href="@{/dashboard_revenuemanagement(page=${currentPage - 1})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                <a class="page-link" th:href="@{/dashboard_revenuemanagement(page=${i})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:if="${currentPage < totalPages - 1}">
                <a class="page-link" th:href="@{/dashboard_revenuemanagement(page=${currentPage + 1})}">Next</a>
            </li>
        </ul>
    </div>

    <!-- Total Donations Summary -->
    <div class="container-fluid mt-3 mb-4">
        <div class="card bg-light">
            <div class="card-body text-center">
                <h5 class="mb-0">
                    <i class="fas fa-chart-bar text-primary"></i>
                    Tổng số đóng góp: <strong class="text-primary" th:text="${totalDonations}">0</strong> lượt
                    &nbsp;|&nbsp;
                    <i class="fas fa-money-bill-wave text-success"></i>
                    Tổng tiền: <strong class="text-success"
                        th:text="${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' VND'">0
                        VND</strong>
                </h5>
            </div>
        </div>
    </div>

    <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmDeleteModalLabel">Xác nhận xóa</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    Bạn có chắc chắn muốn xóa mục này không?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Không</button>
                    <button type="button" class="btn btn-danger" onclick="confirmDelete()">Có</button>
                </div>
            </div>
        </div>
    </div>
</body>
<!-- MDB -->
<script>
    function openDeleteModal(action) {
        document.getElementById('deleteForm').action = action;
        $('#confirmDeleteModal').modal('show');
    }
    function confirmDelete() {
        document.getElementById('deleteForm').submit();
    }

    // Print Report Function
    function printReport() {
        // Create printable content
        var printContent = `
            <html>
            <head>
                <title>Báo cáo đóng góp</title>
                <style>
                    body { font-family: Arial, sans-serif; padding: 20px; }
                    h1 { text-align: center; color: #333; }
                    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
                    th { background-color: #007bff; color: white; }
                    .summary { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 5px; }
                    .date { text-align: right; color: #666; }
                </style>
            </head>
            <body>
                <h1>BÁO CÁO ĐÓNG GÓP</h1>
                <p class="date">Ngày xuất: ${new Date().toLocaleDateString('vi-VN')}</p>
                <div class="summary">
                    <strong>Tổng doanh thu:</strong> ${document.querySelector('.text-success').innerText}<br>
                    <strong>Tổng số đóng góp:</strong> ${document.querySelector('.text-primary strong') ? document.querySelector('.text-primary strong').innerText : '0'} lượt
                </div>
                <table>
                    ${document.querySelector('.table-container table').innerHTML}
                </table>
            </body>
            </html>
        `;

        var printWindow = window.open('', '_blank');
        printWindow.document.write(printContent);
        printWindow.document.close();
        printWindow.focus();
        printWindow.print();
        printWindow.close();
    }

    // Export Detailed Report Function
    function exportDetailedReport() {
        // Create detailed HTML report
        var reportContent = `
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Báo cáo chi tiết đóng góp - Hoàng Thiện Charity</title>
    <style>
        body { font-family: 'Times New Roman', serif; margin: 40px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #0066cc; margin-bottom: 5px; }
        .header h2 { color: #333; margin-top: 0; }
        .info { margin-bottom: 20px; }
        .info p { margin: 5px 0; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #000; padding: 8px; text-align: center; }
        th { background-color: #0066cc; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .summary { margin-top: 30px; padding: 15px; background: #e8f4fc; border: 1px solid #0066cc; }
        .footer { margin-top: 50px; display: flex; justify-content: space-between; }
        .signature { text-align: center; width: 40%; }
        .signature .line { margin-top: 60px; border-top: 1px solid #000; }
    </style>
</head>
<body>
    <div class="header">
        <h1>HOÀNG THIỆN CHARITY</h1>
        <h2>BÁO CÁO CHI TIẾT ĐÓNG GÓP</h2>
    </div>
    
    <div class="info">
        <p><strong>Ngày lập báo cáo:</strong> ${new Date().toLocaleDateString('vi-VN')}</p>
        <p><strong>Người lập:</strong> Quản trị viên</p>
        <p><strong>Kỳ báo cáo:</strong> Theo bộ lọc hiện tại</p>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Mã GD</th>
                <th>Thời gian</th>
                <th>Số tiền (VND)</th>
                <th>Nội dung</th>
                <th>Trạng thái</th>
            </tr>
        </thead>
        <tbody>
            ${getTableRows()}
        </tbody>
    </table>
    
    <div class="summary">
        <strong>TỔNG KẾT:</strong><br>
        - Tổng số giao dịch: ${document.querySelectorAll('.table-container tbody tr').length - 1} lượt<br>
        - Tổng doanh thu: ${document.querySelector('.text-success').innerText}
    </div>
    
    <div class="footer">
        <div class="signature">
            <p><strong>Người lập báo cáo</strong></p>
            <p class="line">(Ký và ghi rõ họ tên)</p>
        </div>
        <div class="signature">
            <p><strong>Người phê duyệt</strong></p>
            <p class="line">(Ký và ghi rõ họ tên)</p>
        </div>
    </div>
</body>
</html>
        `;

        // Open in new window
        var reportWindow = window.open('', '_blank');
        reportWindow.document.write(reportContent);
        reportWindow.document.close();
    }

    function getTableRows() {
        var rows = document.querySelectorAll('.table-container tbody tr');
        var html = '';
        var stt = 1;
        rows.forEach(function (row, index) {
            if (row.cells.length > 1 && row.cells[0].innerText) {
                html += '<tr>';
                html += '<td>' + stt + '</td>';
                for (var i = 0; i < 5; i++) {
                    html += '<td>' + (row.cells[i] ? row.cells[i].innerText : '') + '</td>';
                }
                html += '</tr>';
                stt++;
            }
        });
        return html;
    }

</script>
<!-- Ensure jQuery is included first and only once -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

<!-- Then include Bootstrap and MDB -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.umd.min.js"></script>

</html>
