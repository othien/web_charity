<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${project.id != null} ? 'Sửa dự án' : 'Thêm dự án mới'">Quản lý dự án</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #f5f7fa;
        }

        @media (min-width: 991.98px) {
            main {
                padding-left: 260px;
            }
        }

        .stat-card {
            border-radius: 12px;
            border: none;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .section-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .preview-img {
            max-width: 200px;
            max-height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 0.5rem;
        }
    </style>
</head>

<body>
    <header>
        <div th:replace="page_admin/layout/sidebar :: sidebar"></div>
        <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-mdb-toggle="collapse" data-mdb-target="#sidebarMenu">
                    <i class="fas fa-bars"></i>
                </button>
                <span class="navbar-brand mb-0 h5" th:text="${project.id != null} ? 'Sửa dự án' : 'Thêm dự án mới'">Form
                    dự án</span>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-user me-1"></i> <span
                                th:text="${user}">Admin</span></a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main style="margin-top: 58px;">
        <div class="container-fluid pt-4 px-4">
            <div class="row">
                <div class="col-lg-12">
                    <form id="projectForm"
                        th:action="${fromRequestId != null} ? @{/admin/projects/save-from-request} : @{/admin/projects/save}"
                        method="post" th:object="${project}">
                        <input type="hidden" th:field="*{id}">
                        <input type="hidden" th:field="*{code}">
                        <input type="hidden" th:field="*{status}">
                        <input type="hidden" th:field="*{amountRaised}">
                        <input type="hidden" th:field="*{disbursedAmount}">
                        <input type="hidden" name="fromRequestId" th:value="${fromRequestId}"
                            th:if="${fromRequestId != null}">

                        <div class="row">
                            <!-- Left Column - General Info -->
                            <div class="col-lg-6 mb-4">
                                <div class="card stat-card h-100">
                                    <div class="card-body">
                                        <h6 class="section-header"><i class="fas fa-info-circle me-2"></i>Thông tin tổng
                                            quát</h6>

                                        <div class="mb-3">
                                            <label class="form-label">Tiêu đề dự án <span
                                                    class="text-danger">*</span></label>
                                            <input type="text" class="form-control" th:field="*{title}" required
                                                placeholder="Nhập tiêu đề dự án">
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label">Hình ảnh thumbnail <span
                                                    class="text-danger">*</span></label>
                                            <input type="text" class="form-control" th:field="*{img}" required
                                                placeholder="https://example.com/thumbnail.jpg" id="thumbnailUrl"
                                                onchange="previewImage('thumbnailUrl', 'thumbnailPreview')">
                                            <img id="thumbnailPreview" class="preview-img" th:src="${project.img}"
                                                alt="Preview" style="display: block;"
                                                onerror="this.style.display='none'">
                                        </div>

                                        <div class="row mb-3">
                                            <div class="col-md-6">
                                                <label class="form-label">Danh mục <span
                                                        class="text-danger">*</span></label>
                                                <select class="form-select" th:field="*{displaycategory}" required>
                                                    <option value="">-- Chọn danh mục --</option>
                                                    <option value="Y tế">Y tế</option>
                                                    <option value="Trẻ em">Trẻ em</option>
                                                    <option value="Giáo dục">Giáo dục</option>
                                                    <option value="Thiên tai">Thiên tai</option>
                                                </select>
                                            </div>
                                            <div class="col-md-6">
                                                <label class="form-label">Mục tiêu quyên góp <span
                                                        class="text-danger">*</span></label>
                                                <div class="input-group">
                                                    <input type="text" class="form-control" name="goalAmount"
                                                        id="goalAmountInput"
                                                        th:value="${project.goalAmount != null ? #numbers.formatInteger(project.goalAmount, 0, 'POINT') : ''}"
                                                        required placeholder="10.000.000" pattern="[\d\.]*"
                                                        oninput="formatMoneyInput(this)"
                                                        onblur="formatMoneyInput(this)">
                                                    <span class="input-group-text">₫</span>
                                                </div>
                                                <small class="text-muted">Nhập số tiền (VD: 10.000.000)</small>
                                            </div>
                                        </div>

                                        <div class="row mb-3">
                                            <div class="col-md-6">
                                                <label class="form-label">Ngày bắt đầu <span
                                                        class="text-danger">*</span></label>
                                                <input type="date" class="form-control" name="startDate"
                                                    th:value="${project.startDate != null ? #temporals.format(project.startDate, 'yyyy-MM-dd') : ''}"
                                                    required>
                                            </div>
                                            <div class="col-md-6">
                                                <label class="form-label">Ngày kết thúc <span
                                                        class="text-danger">*</span></label>
                                                <input type="date" class="form-control" name="endDate"
                                                    th:value="${project.endDate != null ? #temporals.format(project.endDate, 'yyyy-MM-dd') : ''}"
                                                    required>
                                            </div>
                                        </div>

                                        <!-- Show status info (read-only) -->
                                        <div class="alert alert-info" th:if="${project.id != null}">
                                            <strong>Trạng thái hiện tại:</strong>
                                            <span th:text="${project.status}">Đang gây quỹ</span>
                                            <br><small class="text-muted">Trạng thái sẽ tự động cập nhật khi đạt mục
                                                tiêu</small>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Right Column - Dynamic Content Editor -->
                            <div class="col-lg-6 mb-4">
                                <div class="card stat-card h-100">
                                    <div class="card-body">
                                        <h6 class="section-header"><i class="fas fa-file-alt me-2"></i>Nội dung chi tiết
                                        </h6>

                                        <!-- Add Block Buttons -->
                                        <div class="mb-3 d-flex gap-2">
                                            <button type="button" class="btn btn-outline-primary btn-sm"
                                                onclick="addTextBlock()">
                                                <i class="fas fa-align-left me-1"></i> Thêm văn bản
                                            </button>
                                            <button type="button" class="btn btn-outline-success btn-sm"
                                                onclick="addImageBlock()">
                                                <i class="fas fa-image me-1"></i> Thêm hình ảnh
                                            </button>
                                        </div>

                                        <!-- Dynamic Content Blocks Container -->
                                        <div id="contentBlocksContainer">
                                            <!-- Blocks will be added here dynamically -->
                                        </div>

                                        <!-- Hidden input to store JSON data -->
                                        <input type="hidden" name="dynamicContent" id="dynamicContentInput"
                                            th:value="${projectDetail != null ? projectDetail.dynamicContent : ''}">

                                        <!-- Hidden inputs for legacy content (for backward compatibility) -->
                                        <input type="hidden" id="legacyContent1"
                                            th:value="${projectDetail != null ? projectDetail.content_1 : ''}">
                                        <input type="hidden" id="legacyImgContent1"
                                            th:value="${projectDetail != null ? projectDetail.img_content : ''}">
                                        <input type="hidden" id="legacyContent2"
                                            th:value="${projectDetail != null ? projectDetail.content_2 : ''}">
                                        <input type="hidden" id="legacyImgContent2"
                                            th:value="${projectDetail != null ? projectDetail.img_content2 : ''}">
                                        <input type="hidden" id="legacyContent3"
                                            th:value="${projectDetail != null ? projectDetail.content_3 : ''}">

                                        <p class="text-muted small mt-2">
                                            <i class="fas fa-info-circle"></i>
                                            Kéo thả để sắp xếp lại thứ tự các block. Nhấn ✕ để xóa.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Show prefill description if from request -->
                        <div class="card stat-card mb-4" th:if="${prefillDescription != null}">
                            <div class="card-body">
                                <h6 class="text-info"><i class="fas fa-info-circle me-2"></i>Thông tin từ yêu cầu hỗ trợ
                                </h6>
                                <div class="alert alert-secondary" th:text="${prefillDescription}">Mô tả...</div>
                            </div>
                        </div>

                        <!-- Form Actions -->
                        <div class="d-flex justify-content-between mb-4">
                            <a href="/admin/projects" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left me-1"></i> Quay lại
                            </a>
                            <button type="button" class="btn btn-primary btn-lg" onclick="confirmSave()">
                                <i class="fas fa-save me-1"></i> Lưu dự án
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const saveUrl = /*[[${fromRequestId != null} ? @{/admin/projects/save-from-request} : @{/admin/projects/save}]]*/ '/admin/projects/save';
        /*]]>*/

        // Format money input with dots (e.g., 10.000.000)
        function formatMoneyInput(input) {
            let value = input.value.replace(/\D/g, ''); // Remove all non-digits
            if (value) {
                value = parseInt(value).toLocaleString('de-DE'); // German locale uses dots
                input.value = value;
            }
        }

        // Convert formatted money back to number before submit
        function prepareFormForSubmit() {
            const goalInput = document.getElementById('goalAmountInput');
            if (goalInput) {
                goalInput.value = goalInput.value.replace(/\./g, ''); // Remove dots
            }
        }

        function previewImage(inputId, previewId) {
            const url = document.getElementById(inputId).value;
            const preview = document.getElementById(previewId);
            if (url) {
                preview.src = url;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }
        }

        // ===== Dynamic Content Block Editor =====
        let blockCounter = 0;

        // Initialize blocks from existing data
        document.addEventListener('DOMContentLoaded', function () {
            const existingData = document.getElementById('dynamicContentInput').value;
            let hasLoadedBlocks = false;

            // Try to load from dynamicContent (new format)
            if (existingData && existingData.trim() !== '' && existingData !== '[]') {
                try {
                    const blocks = JSON.parse(existingData);
                    if (blocks && blocks.length > 0) {
                        blocks.forEach(block => {
                            if (block.type === 'text') {
                                addTextBlock(block.content);
                            } else if (block.type === 'image') {
                                addImageBlock(block.url);
                            }
                        });
                        hasLoadedBlocks = true;
                    }
                } catch (e) {
                    console.log('Invalid JSON in dynamicContent, will try legacy fields');
                }
            }

            // If no dynamic content, load from legacy fields
            if (!hasLoadedBlocks) {
                const legacyContent1 = document.getElementById('legacyContent1')?.value;
                const legacyImg1 = document.getElementById('legacyImgContent1')?.value;
                const legacyContent2 = document.getElementById('legacyContent2')?.value;
                const legacyImg2 = document.getElementById('legacyImgContent2')?.value;
                const legacyContent3 = document.getElementById('legacyContent3')?.value;

                // Add legacy content as blocks (in original order)
                if (legacyContent1 && legacyContent1.trim() !== '') {
                    addTextBlock(legacyContent1);
                    hasLoadedBlocks = true;
                }
                if (legacyImg1 && legacyImg1.trim() !== '') {
                    addImageBlock(legacyImg1);
                    hasLoadedBlocks = true;
                }
                if (legacyContent2 && legacyContent2.trim() !== '') {
                    addTextBlock(legacyContent2);
                    hasLoadedBlocks = true;
                }
                if (legacyImg2 && legacyImg2.trim() !== '') {
                    addImageBlock(legacyImg2);
                    hasLoadedBlocks = true;
                }
                if (legacyContent3 && legacyContent3.trim() !== '') {
                    addTextBlock(legacyContent3);
                    hasLoadedBlocks = true;
                }
            }

            // If still no blocks exist, add a default text block
            if (document.querySelectorAll('.content-block').length === 0) {
                addTextBlock();
            }
        });

        function addTextBlock(content = '') {
            blockCounter++;
            const container = document.getElementById('contentBlocksContainer');
            const blockHtml = `
                <div class="content-block card mb-3" data-type="text" data-id="${blockCounter}">
                    <div class="card-header d-flex justify-content-between align-items-center py-2" style="background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);">
                        <span><i class="fas fa-align-left text-primary me-2"></i>Văn bản</span>
                        <div>
                            <button type="button" class="btn btn-sm btn-link text-muted" onclick="moveBlockUp(${blockCounter})" title="Di chuyển lên"><i class="fas fa-arrow-up"></i></button>
                            <button type="button" class="btn btn-sm btn-link text-muted" onclick="moveBlockDown(${blockCounter})" title="Di chuyển xuống"><i class="fas fa-arrow-down"></i></button>
                            <button type="button" class="btn btn-sm btn-link text-danger" onclick="removeBlock(${blockCounter})" title="Xóa"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                    <div class="card-body py-2">
                        <textarea class="form-control block-content" rows="4" placeholder="Nhập nội dung văn bản...">${content}</textarea>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', blockHtml);
            updateDynamicContent();
        }

        function addImageBlock(url = '') {
            blockCounter++;
            const container = document.getElementById('contentBlocksContainer');
            const blockHtml = `
                <div class="content-block card mb-3" data-type="image" data-id="${blockCounter}">
                    <div class="card-header d-flex justify-content-between align-items-center py-2" style="background: linear-gradient(135deg, #28a74520 0%, #20c99720 100%);">
                        <span><i class="fas fa-image text-success me-2"></i>Hình ảnh</span>
                        <div>
                            <button type="button" class="btn btn-sm btn-link text-muted" onclick="moveBlockUp(${blockCounter})" title="Di chuyển lên"><i class="fas fa-arrow-up"></i></button>
                            <button type="button" class="btn btn-sm btn-link text-muted" onclick="moveBlockDown(${blockCounter})" title="Di chuyển xuống"><i class="fas fa-arrow-down"></i></button>
                            <button type="button" class="btn btn-sm btn-link text-danger" onclick="removeBlock(${blockCounter})" title="Xóa"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                    <div class="card-body py-2">
                        <div class="mb-2">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="imgSource${blockCounter}" id="urlSource${blockCounter}" value="url" checked onchange="toggleImageSource(${blockCounter})">
                                <label class="form-check-label" for="urlSource${blockCounter}">Nhập URL</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="imgSource${blockCounter}" id="fileSource${blockCounter}" value="file" onchange="toggleImageSource(${blockCounter})">
                                <label class="form-check-label" for="fileSource${blockCounter}">Upload file</label>
                            </div>
                        </div>
                        <div id="urlInput${blockCounter}">
                            <input type="text" class="form-control block-content" placeholder="https://example.com/image.jpg" value="${url}" onchange="previewBlockImage(${blockCounter})">
                        </div>
                        <div id="fileInput${blockCounter}" style="display: none;">
                            <input type="file" class="form-control" accept="image/*" onchange="uploadBlockImage(${blockCounter}, this)">
                            <small class="text-muted">Chấp nhận: JPG, PNG, GIF (tối đa 5MB)</small>
                        </div>
                        <div class="mt-2">
                            <img id="preview${blockCounter}" src="${url}" class="preview-img" style="${url ? 'display: block;' : 'display: none;'}" alt="Preview" onerror="this.style.display='none'">
                        </div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', blockHtml);
            updateDynamicContent();
        }

        function toggleImageSource(blockId) {
            const urlRadio = document.getElementById('urlSource' + blockId);
            const urlInput = document.getElementById('urlInput' + blockId);
            const fileInput = document.getElementById('fileInput' + blockId);

            if (urlRadio.checked) {
                urlInput.style.display = 'block';
                fileInput.style.display = 'none';
            } else {
                urlInput.style.display = 'none';
                fileInput.style.display = 'block';
            }
        }

        function previewBlockImage(blockId) {
            const urlInput = document.querySelector(`#urlInput${blockId} input`);
            const preview = document.getElementById('preview' + blockId);
            if (urlInput.value) {
                preview.src = urlInput.value;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }
            updateDynamicContent();
        }

        async function uploadBlockImage(blockId, fileInput) {
            const file = fileInput.files[0];
            if (!file) return;

            // Validate file size (5MB)
            if (file.size > 5 * 1024 * 1024) {
                Swal.fire({ icon: 'error', title: 'Lỗi', text: 'File quá lớn. Tối đa 5MB.' });
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                Swal.fire({ title: 'Đang tải lên...', allowOutsideClick: false, showConfirmButton: false, willOpen: () => Swal.showLoading() });

                const response = await fetch('/api/upload/image', { method: 'POST', body: formData });
                const result = await response.json();

                Swal.close();

                if (result.success) {
                    // Set the URL input value and show preview
                    const urlInput = document.querySelector(`#urlInput${blockId} input`);
                    urlInput.value = result.url;
                    const preview = document.getElementById('preview' + blockId);
                    preview.src = result.url;
                    preview.style.display = 'block';
                    updateDynamicContent();

                    // Switch back to URL mode to show the uploaded URL
                    document.getElementById('urlSource' + blockId).checked = true;
                    toggleImageSource(blockId);

                    Swal.fire({ icon: 'success', title: 'Thành công', text: 'Đã tải lên hình ảnh!', timer: 1500, showConfirmButton: false });
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'Lỗi', text: 'Không thể tải lên: ' + error.message });
            }
        }

        function removeBlock(blockId) {
            const block = document.querySelector(`.content-block[data-id="${blockId}"]`);
            if (block) {
                block.remove();
                updateDynamicContent();
            }
        }

        function moveBlockUp(blockId) {
            const block = document.querySelector(`.content-block[data-id="${blockId}"]`);
            const prev = block.previousElementSibling;
            if (prev && prev.classList.contains('content-block')) {
                block.parentNode.insertBefore(block, prev);
                updateDynamicContent();
            }
        }

        function moveBlockDown(blockId) {
            const block = document.querySelector(`.content-block[data-id="${blockId}"]`);
            const next = block.nextElementSibling;
            if (next && next.classList.contains('content-block')) {
                block.parentNode.insertBefore(next, block);
                updateDynamicContent();
            }
        }

        function updateDynamicContent() {
            const blocks = document.querySelectorAll('.content-block');
            const data = [];

            blocks.forEach(block => {
                const type = block.dataset.type;
                if (type === 'text') {
                    const content = block.querySelector('.block-content').value;
                    data.push({ type: 'text', content: content });
                } else if (type === 'image') {
                    const url = block.querySelector('.block-content').value;
                    data.push({ type: 'image', url: url });
                }
            });

            document.getElementById('dynamicContentInput').value = JSON.stringify(data);
        }

        // Update dynamic content on any input change
        document.getElementById('contentBlocksContainer').addEventListener('input', updateDynamicContent);

        function confirmSave() {
            // Validate form first
            const form = document.getElementById('projectForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            Swal.fire({
                title: 'Xác nhận lưu dự án?',
                text: 'Bạn có chắc chắn muốn lưu thông tin dự án này?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#667eea',
                cancelButtonColor: '#6c757d',
                confirmButtonText: '<i class="fas fa-save"></i> Lưu dự án',
                cancelButtonText: '<i class="fas fa-times"></i> Hủy'
            }).then((result) => {
                if (result.isConfirmed) {
                    // Show loading
                    Swal.fire({
                        title: 'Đang lưu...',
                        text: 'Vui lòng đợi trong giây lát',
                        allowOutsideClick: false,
                        showConfirmButton: false,
                        willOpen: () => {
                            Swal.showLoading();
                        }
                    });

                    // Submit form using fetch API
                    prepareFormForSubmit(); // Convert formatted money to plain number
                    const formData = new FormData(form);

                    fetch(saveUrl, {
                        method: 'POST',
                        body: formData
                    })
                        .then(response => {
                            if (response.redirected) {
                                // Show success message then redirect
                                Swal.fire({
                                    icon: 'success',
                                    title: 'Thành công!',
                                    text: 'Dự án đã được lưu thành công',
                                    confirmButtonColor: '#667eea',
                                    timer: 2000,
                                    timerProgressBar: true
                                }).then(() => {
                                    window.location.href = '/admin/projects';
                                });
                            } else if (response.ok) {
                                Swal.fire({
                                    icon: 'success',
                                    title: 'Thành công!',
                                    text: 'Dự án đã được lưu thành công',
                                    confirmButtonColor: '#667eea',
                                    timer: 2000,
                                    timerProgressBar: true
                                }).then(() => {
                                    window.location.href = '/admin/projects';
                                });
                            } else {
                                throw new Error('Có lỗi xảy ra');
                            }
                        })
                        .catch(error => {
                            Swal.fire({
                                icon: 'error',
                                title: 'Lỗi!',
                                text: 'Không thể lưu dự án: ' + error.message,
                                confirmButtonColor: '#dc3545'
                            });
                        });
                }
            });
        }
    </script>
</body>

</html>
