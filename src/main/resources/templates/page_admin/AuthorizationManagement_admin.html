<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Tài Khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Quản Lý Tài Khoản</h2>
        <!-- Search and Filter Form -->
        <form action="/dashboard_authorization" method="get" class="mb-4">
            <div class="row g-3">
                <div class="col-md-4">
                    <input type="text" name="searchTerm" class="form-control"
                        placeholder="Tìm kiếm theo Tên hoặc Email..." th:value="${searchTerm}">
                </div>
                <div class="col-md-3">
                    <select name="role" class="form-control form-select">
                        <option value="ALL" th:selected="${selectedRole == 'ALL' or selectedRole == null}">Tất cả chức
                            vụ</option>
                        <option value="admin" th:selected="${selectedRole == 'admin'}">Quản trị viên</option>
                        <option value="staff" th:selected="${selectedRole == 'staff'}">Nhân viên</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Tìm kiếm</button>
                </div>
                <div class="col-md-3 text-end">
                    <a class="btn btn-success" href="/insert/authorizaton">Thêm Tài Khoản</a>
                </div>
            </div>
        </form>

        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Mã</th>
                    <th>Tài khoản</th>
                    <th>Mật khẩu</th>
                    <th>Email</th>
                    <th>Chức vụ</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="authorizationModel : ${authorizationModels}">
                    <td th:text="${authorizationModel.id}"></td>
                    <td th:text="${authorizationModel.username}"></td>
                    <td>*****</td>
                    <td th:text="${authorizationModel.email}"></td>
                    <td th:text="${authorizationModel.roles == 'admin' ? 'Quản trị viên' : 'Nhân viên'}"></td>
                    <td>
                        <a th:href="@{'/authorizaton/' + ${authorizationModel.id}}" class="btn btn-info btn-sm">Sửa</a>
                        <button type="button" class="btn btn-danger btn-sm"
                            th:attr="onclick=|openDeleteModal('@{/authorizaton/delete/{id}(id=${authorizationModel.id})}')|">
                            Xóa
                        </button>
                    </td>
                </tr>
                <tr th:if="${authorizationModels.empty}">
                    <td colspan="6" class="text-center">Không tìm thấy tài khoản nào.</td>
                </tr>
            </tbody>
        </table>

        <!-- Pagination -->
        <nav aria-label="Page navigation" th:if="${totalPages > 0}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link"
                        th:href="@{/dashboard_authorization(page=${currentPage - 1}, searchTerm=${searchTerm}, role=${selectedRole})}">Trước</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${currentPage == i} ? 'active'">
                    <a class="page-link"
                        th:href="@{/dashboard_authorization(page=${i}, searchTerm=${searchTerm}, role=${selectedRole})}"
                        th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link"
                        th:href="@{/dashboard_authorization(page=${currentPage + 1}, searchTerm=${searchTerm}, role=${selectedRole})}">Sau</a>
                </li>
            </ul>
        </nav>
    </div>

    <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmDeleteModalLabel">Xác nhận xóa</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    Bạn có chắc chắn muốn xóa mục này không?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Không</button>
                    <button type="button" class="btn btn-danger" onclick="confirmDelete()">Có</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        function openDeleteModal(action) {
            document.getElementById('deleteForm').action = action;
            $('#confirmDeleteModal').modal('show');
        }
        function confirmDelete() {
            document.getElementById('deleteForm').submit();
        }

    </script>
    <!-- Ensure jQuery is included first and only once -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

    <!-- Then include Bootstrap and MDB -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript"
        src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.umd.min.js"></script>
</body>

</html>
