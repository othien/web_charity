<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Dự án</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
</head>

<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Quản Lý Dự Án</h2>

        <!-- Search and Filter Form -->
        <form th:action="@{/dashboard_campaignmanagement}" method="get" class="mb-4">
            <div class="row g-3">
                <div class="col-md-4">
                    <input type="text" name="searchTerm" th:value="${searchTerm}" class="form-control"
                        placeholder="Tìm kiếm theo Mã, Tiêu đề...">
                </div>
                <div class="col-md-3">
                    <select name="category" class="form-select">
                        <option value="ALL" th:selected="${selectedCategory == 'ALL' || selectedCategory == null}">Tất
                            cả danh mục</option>
                        <option value="Y tế" th:selected="${selectedCategory == 'Y tế'}">Y tế</option>
                        <option value="Trẻ em" th:selected="${selectedCategory == 'Trẻ em'}">Trẻ em</option>
                        <option value="Giáo dục" th:selected="${selectedCategory == 'Giáo dục'}">Giáo dục</option>
                        <option value="Bệnh hiểm nghèo" th:selected="${selectedCategory == 'Bệnh hiểm nghèo'}">
                            Bệnh hiểm nghèo</option>
                        <option value="Thiên tai" th:selected="${selectedCategory == 'Thiên tai'}">Thiên tai</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select name="status" class="form-select">
                        <option value="ALL" th:selected="${selectedStatus == 'ALL' || selectedStatus == null}">Tất cả
                            trạng thái</option>
                        <option value="Đang vận động" th:selected="${selectedStatus == 'Đang vận động'}">Đang vận động
                        </option>
                        <option value="Đã đóng" th:selected="${selectedStatus == 'Đã đóng'}">Đã đóng</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Lọc</button>
                </div>
            </div>
            <div class="row g-3 mt-1">
                <div class="col-md-12 text-end">
                    <a class="btn btn-success" th:href="@{/insert/campaign}">
                        <i class="fas fa-plus me-2"></i>Thêm Mới
                    </a>
                </div>
            </div>
        </form>

        <table class="table table-bordered table-striped align-middle">
            <thead class="table-dark text-center">
                <tr>
                    <th style="width: 5%">Mã</th>
                    <th style="width: 20%">Tiêu đề</th>
                    <th style="width: 10%">Ảnh</th>
                    <th style="width: 15%">Thời gian</th>
                    <th style="width: 10%">Đã góp</th>
                    <th style="width: 10%">Mục tiêu</th>
                    <th style="width: 10%">Trạng thái</th>
                    <th style="width: 10%">Loại</th>
                    <th style="width: 10%">Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="campaign : ${fundraisingCampaignModel}">
                    <th scope="row" th:text="${campaign.code}" class="text-center"></th>
                    <td th:text="${campaign.title}"></td>
                    <td class="text-center">
                        <img th:src="${campaign.img}" alt="Img"
                            style="width: 80px; height: 50px; object-fit: cover; border-radius: 4px;">
                    </td>
                    <td class="text-center">
                        <div th:text="${#temporals.format(campaign.startDate, 'dd/MM/yyyy')}"></div>
                        <div class="text-muted small">đến</div>
                        <div th:text="${#temporals.format(campaign.endDate, 'dd/MM/yyyy')}"></div>
                    </td>
                    <td class="text-end"
                        th:text="${#numbers.formatDecimal(campaign.amountRaised, 0, 'COMMA', 0, 'POINT')}"></td>
                    <td class="text-end"
                        th:text="${#numbers.formatDecimal(campaign.goalAmount, 0, 'COMMA', 0, 'POINT')}"></td>
                    <td class="text-center">
                        <span
                            th:class="${campaign.status == 'Đang vận động' ? 'badge bg-success' : 'badge bg-secondary'}"
                            th:text="${campaign.status}"></span>
                    </td>
                    <td th:text="${campaign.displaycategory}" class="text-center"></td>
                    <td class="text-center">
                        <div class="dropdown">
                            <button class="btn btn-secondary btn-sm dropdown-toggle" type="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                Chọn
                            </button>
                            <ul class="dropdown-menu">
                                <li>
                                    <a class="dropdown-item" th:href="@{'/campaignmanagement/' + ${campaign.id}}">
                                        <i class="fas fa-edit me-2"></i>Sửa
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item" th:href="@{'/du-an/' + ${campaign.id}}" target="_blank">
                                        <i class="fas fa-eye me-2"></i>Xem chi tiết
                                    </a>
                                </li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li>
                                    <form th:action="@{/updateStatusCampaign}" method="post" class="d-inline">
                                        <input type="hidden" name="id" th:value="${campaign.id}" />
                                        <input type="hidden" name="status"
                                            th:value="${campaign.status == 'Đang vận động' ? 'Đã đóng' : 'Đang vận động'}" />
                                        <button type="submit" class="dropdown-item">
                                            <i class="fas fa-sync-alt me-2"></i>Đổi trạng thái
                                        </button>
                                    </form>
                                </li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li>
                                    <button type="button" class="dropdown-item text-danger"
                                        th:onclick="'openDeleteModal(\'/campaign/delete/' + ${campaign.id} + '\')'">
                                        <i class="fas fa-trash-alt me-2"></i>Xóa
                                    </button>
                                </li>
                            </ul>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(fundraisingCampaignModel)}">
                    <td colspan="9" class="text-center">Không tìm thấy dự án nào.</td>
                </tr>
            </tbody>
        </table>

        <!-- Pagination -->
        <nav aria-label="Page navigation" th:if="${totalPages > 0}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link"
                        th:href="@{/dashboard_campaignmanagement(page=${currentPage - 1}, searchTerm=${searchTerm}, category=${selectedCategory}, status=${selectedStatus})}">Trước</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${currentPage == i} ? 'active'">
                    <a class="page-link"
                        th:href="@{/dashboard_campaignmanagement(page=${i}, searchTerm=${searchTerm}, category=${selectedCategory}, status=${selectedStatus})}"
                        th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link"
                        th:href="@{/dashboard_campaignmanagement(page=${currentPage + 1}, searchTerm=${searchTerm}, category=${selectedCategory}, status=${selectedStatus})}">Sau</a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- Modal Confirm Delete -->
    <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmDeleteModalLabel">Xác nhận xóa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Bạn có chắc chắn muốn xóa dự án này không?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Không</button>
                    <!-- Form for deletion -->
                    <form id="deleteForm" method="post" action="">
                        <button type="submit" class="btn btn-danger">Có</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function openDeleteModal(action) {
            document.getElementById('deleteForm').action = action;
            var myModal = new bootstrap.Modal(document.getElementById('confirmDeleteModal'));
            myModal.show();
        }
    </script>
</body>

</html>
