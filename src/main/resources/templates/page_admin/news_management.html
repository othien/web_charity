<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin tức cộng đồng - Admin</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #f5f7fa;
        }

        @media (min-width: 991.98px) {
            main {
                padding-left: 260px;
            }
        }

        .stat-card {
            border-radius: 12px;
            border: none;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body>
    <header>
        <div th:replace="page_admin/layout/sidebar :: sidebar"></div>
        <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-mdb-toggle="collapse" data-mdb-target="#sidebarMenu">
                    <i class="fas fa-bars"></i>
                </button>
                <span class="navbar-brand mb-0 h5">Tin tức cộng đồng</span>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-user me-1"></i> <span
                                th:text="${user}">Admin</span></a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main style="margin-top: 58px;">
        <div class="container-fluid pt-4 px-4">
            <!-- Success/Error Messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle me-2"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-mdb-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Professional Filter Section -->
            <div class="card stat-card mb-4">
                <div class="card-header bg-white py-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <h6 class="mb-0"><i class="fas fa-filter text-primary me-2"></i>Bộ lọc tìm kiếm</h6>
                        <div>
                            <button type="button" class="btn btn-sm btn-outline-secondary me-2"
                                onclick="clearFilters()">
                                <i class="fas fa-times me-1"></i>Xóa bộ lọc
                            </button>
                            <a href="/admin/news/create" class="btn btn-sm btn-success">
                                <i class="fas fa-plus me-1"></i>Thêm tin tức
                            </a>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <form id="filterForm" class="row g-3" method="get" action="/admin/news">
                        <!-- Search Box -->
                        <div class="col-md-4">
                            <label class="form-label"><i class="fas fa-search me-1"></i>Tìm kiếm</label>
                            <input type="text" class="form-control" name="searchTerm" id="searchTerm"
                                placeholder="Tiêu đề, mô tả tin tức..." th:value="${searchTerm}">
                        </div>

                        <!-- Date Range Filter -->
                        <div class="col-md-2">
                            <label class="form-label"><i class="fas fa-calendar me-1"></i>Từ ngày</label>
                            <input type="date" class="form-control" name="fromDate" id="fromDate"
                                th:value="${fromDate}">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label"><i class="fas fa-calendar-alt me-1"></i>Đến ngày</label>
                            <input type="date" class="form-control" name="toDate" id="toDate" th:value="${toDate}">
                        </div>

                        <!-- Sort Options -->
                        <div class="col-md-2">
                            <label class="form-label"><i class="fas fa-sort me-1"></i>Sắp xếp</label>
                            <select class="form-select" name="sortBy" id="sortBy">
                                <option value="newest" th:selected="${sortBy == 'newest' || sortBy == null}">Mới nhất
                                    trước</option>
                                <option value="oldest" th:selected="${sortBy == 'oldest'}">Cũ nhất trước</option>
                            </select>
                        </div>

                        <!-- Action Buttons -->
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-search me-1"></i>Tìm kiếm
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Active Filters Display -->
                <div class="card-footer bg-light py-2"
                    th:if="${searchTerm != null || fromDate != null || toDate != null}">
                    <small class="text-muted me-2">Đang lọc:</small>
                    <span th:if="${searchTerm != null && !searchTerm.isEmpty()}" class="badge bg-primary me-1">
                        Từ khóa: <span th:text="${searchTerm}"></span>
                        <a href="#" onclick="removeFilter('searchTerm')" class="text-white ms-1"><i
                                class="fas fa-times-circle"></i></a>
                    </span>
                    <span th:if="${fromDate != null}" class="badge bg-secondary me-1">
                        Từ: <span th:text="${fromDate}"></span>
                        <a href="#" onclick="removeFilter('fromDate')" class="text-white ms-1"><i
                                class="fas fa-times-circle"></i></a>
                    </span>
                    <span th:if="${toDate != null}" class="badge bg-secondary me-1">
                        Đến: <span th:text="${toDate}"></span>
                        <a href="#" onclick="removeFilter('toDate')" class="text-white ms-1"><i
                                class="fas fa-times-circle"></i></a>
                    </span>
                </div>
            </div>

            <!-- News List -->
            <div class="card stat-card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Hình ảnh</th>
                                    <th>Tiêu đề</th>
                                    <th>Mô tả</th>
                                    <th>Ngày cập nhật</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="n : ${newsList}">
                                    <td th:text="${n.id}">1</td>
                                    <td>
                                        <img th:src="${n.img_news}" th:alt="${n.title_news}"
                                            style="width: 80px; height: 60px; object-fit: cover; border-radius: 4px;"
                                            onerror="this.src='https://via.placeholder.com/80x60?text=No+Image'">
                                    </td>
                                    <td>
                                        <strong th:text="${#strings.abbreviate(n.title_news, 50)}">Tiêu đề tin</strong>
                                    </td>
                                    <td th:text="${#strings.abbreviate(n.sub_titlenews, 60)}">Mô tả ngắn...</td>
                                    <td
                                        th:text="${n.date_update != null} ? ${#temporals.format(n.date_update, 'dd/MM/yyyy')} : '-'">
                                        01/01/2024</td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/admin/news/edit/{id}(id=${n.id})}"
                                                class="btn btn-outline-primary" title="Sửa">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <a th:href="@{/admin/news/delete/{id}(id=${n.id})}"
                                                class="btn btn-outline-danger"
                                                onclick="return confirm('Bạn có chắc muốn xóa tin tức này?')"
                                                title="Xóa">
                                                <i class="fas fa-trash"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(newsList)}">
                                    <td colspan="6" class="text-center text-muted py-4">Không có tin tức nào</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <!-- Pagination -->
                <div class="card-footer bg-white d-flex justify-content-between align-items-center"
                    th:if="${totalPages > 1}">
                    <span class="text-muted">Trang <span th:text="${currentPage + 1}">1</span> / <span
                            th:text="${totalPages}">1</span>
                        (<span th:text="${totalElements}">0</span> kết quả)
                    </span>
                    <nav>
                        <ul class="pagination pagination-sm mb-0">
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link"
                                    th:href="@{/admin/news(page=${currentPage - 1}, searchTerm=${searchTerm}, fromDate=${fromDate}, toDate=${toDate}, sortBy=${sortBy})}">Trước</a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                th:classappend="${i == currentPage} ? 'active'"
                                th:if="${totalPages <= 10 || (i == 0) || (i == totalPages - 1) || (i >= currentPage - 2 && i <= currentPage + 2)}">
                                <a class="page-link"
                                    th:href="@{/admin/news(page=${i}, searchTerm=${searchTerm}, fromDate=${fromDate}, toDate=${toDate}, sortBy=${sortBy})}"
                                    th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                <a class="page-link"
                                    th:href="@{/admin/news(page=${currentPage + 1}, searchTerm=${searchTerm}, fromDate=${fromDate}, toDate=${toDate}, sortBy=${sortBy})}">Sau</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // ===== Filter Functions =====
        function clearFilters() {
            window.location.href = '/admin/news';
        }

        function removeFilter(filterName) {
            event.preventDefault();
            const url = new URL(window.location.href);
            url.searchParams.delete(filterName);
            window.location.href = url.toString();
        }

        // SweetAlert for delete confirmation
        function confirmDelete(id) {
            Swal.fire({
                title: 'Xác nhận xóa?',
                text: 'Bạn có chắc chắn muốn xóa tin tức này? Hành động này không thể hoàn tác!',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d',
                confirmButtonText: '<i class="fas fa-trash"></i> Xóa',
                cancelButtonText: '<i class="fas fa-times"></i> Hủy'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = '/admin/news/delete/' + id;
                }
            });
        }
    </script>
</body>

</html>
