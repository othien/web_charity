<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống kê dữ liệu</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Căn chỉnh body để form đẹp và căn giữa */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7fc;
            padding: 0;
            margin: 0;
        }

        /* Căn giữa container */
        .container {
            margin-top: 50px;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Tiêu đề form */
        h2 {
            text-align: center;
            color: #007bff;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 30px;
        }

        /* Các trường nhập liệu */
        .form-group {
            margin-bottom: 20px;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid #ced4da;
            padding: 12px 20px;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
            transition: border 0.3s ease, box-shadow 0.3s ease;
        }

        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
            outline: none;
        }

        .form-control::placeholder {
            color: #6c757d;
            font-style: italic;
        }

        /* Nút bấm "Hiển thị" */
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        .btn:focus {
            outline: none;
        }

        /* Modal styles */
        .modal-content {
            border-radius: 10px;
        }

        .modal-header {
            background-color: #007bff;
            color: white;
            text-align: center;
        }

        .modal-body {
            font-size: 16px;
            text-align: center;
        }

        .modal-footer {
            justify-content: center;
        }
    </style>

</head>

<body>
    <div class="container">
        <h2 class="mt-5">Thống Kê Tổng Quan</h2>

        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card text-white bg-success mb-3">
                    <div class="card-header">Tổng Doanh Thu</div>
                    <div class="card-body">
                        <h5 class="card-title"
                            th:text="${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND
                        </h5>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-info mb-3">
                    <div class="card-header">Tổng Số Dự Án</div>
                    <div class="card-body">
                        <h5 class="card-title" th:text="${totalProjects}">0</h5>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-warning mb-3">
                    <div class="card-header">Tổng Tin Tức</div>
                    <div class="card-body">
                        <h5 class="card-title" th:text="${totalNews}">0</h5>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>

</body>


</body>

</html>
