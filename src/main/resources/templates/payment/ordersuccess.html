<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.min.css" rel="stylesheet" />
    <title>Thanh toán thành công</title>
    <style>
        body {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }

        .success-header {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            animation: pop-in 0.5s ease;
        }

        .success-icon i {
            font-size: 40px;
            color: #28a745;
        }

        @keyframes pop-in {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-body {
            padding: 30px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #666;
            font-weight: 500;
        }

        .info-value {
            color: #333;
            font-weight: 600;
            text-align: right;
        }

        .amount-highlight {
            font-size: 1.3em;
            color: #28a745;
        }

        .message-box {
            background: #e8f5e9;
            border-left: 4px solid #28a745;
            padding: 15px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
        }

        .btn-home {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            border: none;
            border-radius: 10px;
            padding: 15px 30px;
            font-size: 1em;
            font-weight: 600;
            width: 100%;
            color: white;
            text-decoration: none;
            display: block;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(40, 167, 69, 0.4);
            color: white;
        }
    </style>
</head>

<body>
    <div class="success-card">
        <div class="success-header">
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
            <h2>Thanh toán thành công!</h2>
            <p>Cảm ơn bạn đã đóng góp cho quỹ từ thiện</p>
        </div>

        <div class="success-body">
            <!-- Success Message -->
            <div class="message-box" th:if="${message != null}">
                <i class="fas fa-heart text-danger me-2"></i>
                <span th:text="${message}">Quyên góp thành công!</span>
            </div>

            <!-- Transaction Details -->
            <div class="info-row">
                <span class="info-label"><i class="fas fa-file-invoice me-2"></i>Nội dung</span>
                <span class="info-value" th:text="${orderId}">Ung ho du an</span>
            </div>
            <div class="info-row">
                <span class="info-label"><i class="fas fa-money-bill-wave me-2"></i>Số tiền</span>
                <span class="info-value amount-highlight"
                    th:text="${#numbers.formatDecimal(totalPrice, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">100,000 VNĐ</span>
            </div>
            <div class="info-row">
                <span class="info-label"><i class="fas fa-clock me-2"></i>Thời gian</span>
                <span class="info-value" th:text="${paymentTime}">12/28/2024 13:00:00</span>
            </div>
            <div class="info-row">
                <span class="info-label"><i class="fas fa-hashtag me-2"></i>Mã giao dịch</span>
                <span class="info-value" th:text="${transactionId}">123456789</span>
            </div>

            <!-- Action Buttons -->
            <a href="/trang-chu" class="btn-home mt-4">
                <i class="fas fa-home me-2"></i>Về trang chủ
            </a>
            <a href="/du-an" class="btn btn-outline-success btn-block mt-2" style="border-radius: 10px; padding: 12px;">
                <i class="fas fa-hand-holding-heart me-2"></i>Xem các dự án khác
            </a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.min.js"></script>
</body>

</html>
