<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>
    <!-- MDB -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
</head>

<body style="background-color: #f8f9fa;">

    <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                <div class="card shadow-2-strong" style="border-radius: 1rem;">
                    <div class="card-body p-5 text-center">

                        <h3 class="mb-5">Quên mật khẩu?</h3>
                        <p class="text-muted mb-4">Nhập địa chỉ email của bạn và chúng tôi sẽ gửi cho bạn mật khẩu mới.
                        </p>

                        <form action="/forgot-password" method="post">
                            <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
                            <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>

                            <div class="form-outline mb-4">
                                <input type="email" id="typeEmailX-2" name="email" class="form-control form-control-lg"
                                    required />
                                <label class="form-label" for="typeEmailX-2">Email</label>
                            </div>

                            <button class="btn btn-primary btn-lg btn-block" type="submit">Gửi mật khẩu mới</button>

                            <hr class="my-4">

                            <a href="/dang-nhap" class="btn btn-link btn-block">Quay lại đăng nhập</a>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.min.js"></script>
</body>

</html>
